  # OrderLocationType (CUSTOMER/CUSTOM/REMOTE) — same situation, inlined per schema.

  - target: $.components.schemas.CreateBasketOrder.properties.orderLocationType
    description: OrderLocationType enum (inlined) has no per-value description
    update:
      description: >
        Where this order takes place:<ul><li>CUSTOMER: at the customer's registered address
        (default).</li><li>CUSTOM: at a custom location given in customLocation, distinct from
        the customer's address.</li><li>REMOTE: no physical location — the order is always
        considered reachable (no travel time, no geofence check), for services performed
        off-site (e.g. a phone-based service).</li></ul>

  - target: $.components.schemas.CreatePlanningOrder.properties.orderLocationType
