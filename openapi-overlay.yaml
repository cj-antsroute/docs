overlay: 1.0.0
info:
  title: AntsRoute capi documentation enrichments
  version: 1.0.0
  description: >
    Additive documentation layer applied on top of the live OpenAPI spec published at
    https://app.antsroute.com/v3/api-docs/public. Every action here only adds descriptions,
    examples, or a missing response schema — it never changes a field's type, requiredness, or
    structure. Source of truth stays the Java annotations in antsroute-back/web.capi; this file
    only fills gaps without touching that code. Kept in sync by docs/scripts/refresh-openapi.sh.
actions:
  # --- 1. Peripheral DTOs without field-level descriptions ---

  - target: $.components.schemas.PublicAgent.properties.firstName
    description: PublicAgent.firstName has no description
    update:
      description: Agent's first name.

  - target: $.components.schemas.PublicAgent.properties.lastName
    description: PublicAgent.lastName has no description
    update:
      description: Agent's last name.

  - target: $.components.schemas.PublicAgent.properties.email
    description: PublicAgent.email has no description
    update:
      description: Agent's email address — used as the identifier in most /capi/agent endpoints.

  - target: $.components.schemas.PublicAgent.properties.phoneNumber
    description: PublicAgent.phoneNumber has no description
    update:
      description: Agent's phone number.

  - target: $.components.schemas.PublicAgent.properties.defaultVehicle
    description: PublicAgent.defaultVehicle has no description
    update:
      description: >
        Vehicle assigned to the agent by default. Optional: an agent can have no default
        vehicle, in which case one is assigned per day through the dispatch schedule.

  - target: $.components.schemas.PublicAgent.properties.skills
    description: PublicAgent.skills has no description
    update:
      description: Skills held by the agent, used to match them against orders requiring them.

  - target: $.components.schemas.PublicAgent.properties.costPerHour
    description: PublicAgent.costPerHour has no description
    update:
      description: Hourly cost of the agent, used in route cost calculations.

  - target: $.components.schemas.PublicAgent.properties.color
    description: PublicAgent.color has no description
    update:
      description: Color used to represent the agent and their routes in the AntsRoute UI.

  - target: $.components.schemas.PublicAgent.properties.externalId
    description: PublicAgent.externalId has no description
    update:
      description: Identifier of the agent in your own system, if synchronized.

  - target: $.components.schemas.TrackingLink.properties.url
    description: TrackingLink.url has no description
    update:
      description: >
        Public URL the end customer can use to track the order live. Empty if the order is
        still in the basket (CREATED state).

  # --- 2. Enum values without per-value description ---
  # ServiceType (SERVICE/PICKUP/DELIVERY) is inlined per schema (no shared component), so each
  # occurrence needs its own action.

  - target: $.components.schemas.CreateBasketOrder.properties.type
    description: ServiceType enum (inlined) has no per-value description
    update:
      description: >
        Type of service for this order:<ul><li>SERVICE: a single, standalone
        intervention.</li><li>PICKUP: a collection of goods from the customer — part of a
        pickup & delivery pair.</li><li>DELIVERY: a delivery of goods to the customer — part of
        a pickup & delivery pair.</li></ul>

  - target: $.components.schemas.CreatePlanningOrder.properties.type
    description: ServiceType enum (inlined) has no per-value description
    update:
      description: >
        Type of service for this order:<ul><li>SERVICE: a single, standalone
        intervention.</li><li>PICKUP: a collection of goods from the customer — part of a
        pickup & delivery pair.</li><li>DELIVERY: a delivery of goods to the customer — part of
        a pickup & delivery pair.</li></ul>

  - target: $.components.schemas.CreateRouteOrder.properties.type
